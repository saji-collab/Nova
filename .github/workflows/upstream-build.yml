name: NOVA Android build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upstream-build.yml"
      - "README.md"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout NOVA build configuration
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch official Telegram source and submodules
        run: |
          git clone --depth 1 --recursive --shallow-submodules https://github.com/DrKLO/Telegram.git upstream

      - name: Apply NOVA branding and app identity
        run: python3 scripts/brand_nova.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build upstream Android debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Android-debug
          path: upstream/TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 7
